session:
  team_id: alpha
  session_id: test_session_001
  task_id: distributed_task
  frequency_hz: 20.0
  target_cycle_offset: 1
  participants: [uav01, uav02, uav03]

time:
  provider: chrony
  require_clock_ok_to_start: true
  max_clock_uncertainty_ms: 1.0

zenoh:
  mode: client
  endpoints:
    - tcp/192.168.1.10:7447

channels:
  - name: solution
    profile: realtime_sample
    direction: pubsub
    schema_id: user.solution.v1
    encoding: application/protobuf
    frequency_hz: 20.0
    payload_bytes_p95_estimate: 600
    receive_cutoff_ms: 0.0
    late_record_window_ms: 50.0
    ttl_ms: 100.0
    target_cycle_offset: 1

  - name: health
    profile: health
    direction: publish
    schema_id: swarm.health.v1
    encoding: application/json
    frequency_hz: 2.0

weaknet:
  traffic_budget:
    max_realtime_air_bps: 2000000
    safety_factor: 1.35
    reject_if_exceeded: true
    warn_if_above_ratio: 0.75

  payload_guard:
    realtime:
      warn_bytes: 800
      reject_bytes: 1200
      allow_compression: true
      compression_min_bytes: 512

  send_stagger:
    enabled: true
    mode: deterministic_micro_slot
    max_spread_ms: 5
    slot_width_ms: 0.5

  adaptive_recommendation:
    enabled: true
    suggestion_only: true
    target_cycle_offset:
      min: 1
      max: 4
    switch_up_if:
      fresh_ratio_below: 0.95
      window_cycles: 100
    switch_down_if:
      fresh_ratio_above: 0.995
      window_cycles: 500

  state_machine:
    enabled: true
    config_ref: specs/state_machine.yaml
