peer_channel_metrics:
  counters:
    - fresh_count
    - late_count
    - missing_count
    - wrong_cycle_count
    - duplicate_count
    - bad_payload_count
    - seq_gap_count
    - oversized_drop_count
  gauges:
    - rx_latency_p50_ns
    - rx_latency_p95_ns
    - rx_latency_p99_ns
    - payload_size_p95_bytes
    - queue_age_cycles_max
    - fresh_ratio
    - late_ratio
    - missing_ratio
  labels:
    - session_id
    - task_id
    - peer_id
    - channel
    - local_node_id

node_metrics:
  - local_cycle_jitter_p99_ns
  - publish_deadline_miss_ratio
  - local_clock_offset_ns
  - local_clock_uncertainty_ns
  - local_clock_quality
  - local_clock_source
  - local_clock_phase
  - weaknet_state
  - recommendation_count
