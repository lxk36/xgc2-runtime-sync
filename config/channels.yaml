channels:
  - name: solution
    direction: pubsub
    payload_type: application/protobuf
    schema_id: user.solution.v1
    frequency_hz: 20.0
    target_cycle_offset: 1
    publish_deadline_ms: 40
    receive_cutoff_ms: 50
    ttl_ms: 100
    expected_from:
      - uav01
      - uav02
      - uav03
    qos:
      reliability: best_effort
      congestion_control: drop
      priority: realtime

  - name: status
    direction: publish
    payload_type: application/json
    schema_id: swarm.status.v1
    frequency_hz: 2.0
    target_cycle_offset: 0
    publish_deadline_ms: 500
    receive_cutoff_ms: 1000
    ttl_ms: 2000
    qos:
      reliability: best_effort
      congestion_control: drop
      priority: data
