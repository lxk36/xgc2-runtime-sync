team_id: alpha
session_id: demo_session_001
task_id: distributed_task

participants:
  self_id: uav01
  required:
    - uav01
    - uav02
    - uav03
  optional: []

timing:
  frequency_hz: 20.0
  # The ground station overrides epoch_ns at session start.
  epoch_ns: 0
  target_cycle_offset: 1

time:
  provider: chrony
  authority: ground_station
  ground_time_source: 192.168.10.10
  phase_source: external
  require_clock_ok_to_start: true
  max_clock_uncertainty_ms: 2.0
  preflight_max_offset_ms: 2.0
  preflight_max_uncertainty_ms: 2.0
  degraded_clock_uncertainty_ms: 1.0
  in_flight_allow_step: false
  external_sources_allowed_in_flight: false

zenoh:
  mode: client
  endpoints:
    - tcp/192.168.10.10:7447
  key_prefix: swarm/alpha/session/demo_session_001
