channel_profiles:
  realtime_sample:
    description: "周期实时样本，新鲜优先，不做 ACK"
    zenoh:
      reliability: best_effort
      congestion_control: drop
      priority: real_time
      express: true
    runtime:
      allow_ack: false
      max_queue_cycles: 1
      drop_policy: drop_oldest_before_send
      receive_status_required: true

  health:
    description: "低频健康状态"
    zenoh:
      reliability: best_effort
      congestion_control: drop
      priority: data_low
      express: false
    runtime:
      allow_ack: false
      max_hz: 2

  command_config:
    description: "会话配置和启动命令，非实时路径"
    zenoh:
      reliability: reliable
      congestion_control: block
      priority: interactive_high
      express: true
    runtime:
      realtime_path: false
      readiness_required: true

  bulk_debug:
    description: "调试和大数据，弱网时首先裁剪"
    zenoh:
      reliability: best_effort
      congestion_control: drop
      priority: background
      express: false
    runtime:
      max_bandwidth_kbps: 50
      disable_when_state_at_least: degraded
