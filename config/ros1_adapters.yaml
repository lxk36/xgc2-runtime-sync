ros1_adapters:
  # Runtime Sync is task-semantic by default. ROS graph topics are never bridged
  # unless a rule below explicitly maps them into an envelope channel/schema.
  deny_by_default: true

  rules:
    - name: local_solution
      topic: /local_solution
      channel: solution
      schema_id: user.solution.v1
      payload_type: bytes
      enabled: true
      max_payload_bytes: 65536
      required: true

    - name: remote_solution
      topic: /remote_solution
      channel: remote_solution
      schema_id: user.remote_solution.v1
      payload_type: bytes
      enabled: true
      max_payload_bytes: 65536
      required: false

    # Deliberately disabled example: image-like topics are default-denied and
    # require allow_large_payload=true plus an explicit size cap.
    - name: debug_thumbnail
      topic: /debug/thumbnail_image
      channel: debug_thumbnail
      schema_id: user.debug_thumbnail.v1
      payload_type: bytes
      enabled: false
      allow_large_payload: true
      max_payload_bytes: 262144
      required: false
