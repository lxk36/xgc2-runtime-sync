keyspace:
  sample: "swarm/{team_id}/session/{session_id}/node/{sender_id}/channel/{channel}/cycle/{target_cycle}"
  health: "swarm/{team_id}/session/{session_id}/node/{node_id}/health"
  link_health: "swarm/{team_id}/session/{session_id}/node/{node_id}/link_health/{peer_id}/{channel}"
  state: "swarm/{team_id}/session/{session_id}/node/{node_id}/weaknet_state"
  recommendation: "swarm/{team_id}/session/{session_id}/node/{node_id}/recommendation"
  budget_report: "swarm/{team_id}/session/{session_id}/budget_report"
  config: "swarm/{team_id}/session/{session_id}/config"
  command: "swarm/{team_id}/session/{session_id}/cmd/{command}"

subscriptions:
  realtime_samples: "swarm/{team_id}/session/{session_id}/node/*/channel/*/cycle/*"
  all_health: "swarm/{team_id}/session/{session_id}/node/*/health"
  all_link_health: "swarm/{team_id}/session/{session_id}/node/*/link_health/**"
