required_sections:
  - session
  - time
  - zenoh
  - channels
  - weaknet

session:
  team_id: string
  session_id: string
  participants: list[string]
  epoch_ns: int64
  period_ns: int64

weaknet:
  receive_window:
    receive_cutoff_ms: float
    late_record_window_ms: float
    ttl_ms: float
  adaptive_recommendation:
    enabled: bool
    suggestion_only: true
  send_stagger:
    enabled: bool
    mode: enum[immediate, deterministic_micro_slot]
  traffic_budget:
    max_realtime_air_bps: int
    reject_if_exceeded: bool
  payload_guard:
    realtime:
      warn_bytes: int
      reject_bytes: int
  state_machine:
    enabled: bool
