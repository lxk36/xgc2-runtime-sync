states:
  - GOOD
  - DEGRADED
  - CONGESTED
  - PARTITIONED
  - RECOVERING

transitions:
  GOOD_to_DEGRADED:
    window_cycles: 100
    if_any:
      late_ratio_gt: 0.02
      missing_ratio_gt: 0.01
  DEGRADED_to_CONGESTED:
    window_cycles: 100
    if_any:
      fresh_ratio_lt: 0.90
      rx_latency_p99_gt_period_ratio: 0.8
      max_queue_age_cycles_gt: 1
  CONGESTED_to_PARTITIONED:
    window_cycles: 10
    if_any:
      fresh_ratio_eq: 0.0
      no_sample_cycles_gt: 10
  PARTITIONED_to_RECOVERING:
    window_cycles: 20
    if_all:
      fresh_ratio_gt: 0.50
      peer_seen_recently: true
  RECOVERING_to_GOOD:
    window_cycles: 500
    if_all:
      fresh_ratio_gt: 0.995
      late_ratio_lt: 0.005
      missing_ratio_lt: 0.001

actions:
  DEGRADED:
    recommendations:
      - disable_bulk_debug
  CONGESTED:
    recommendations:
      - lower_frequency
      - increase_target_cycle_offset
      - reduce_payload_size
  PARTITIONED:
    recommendations:
      - mark_peer_unavailable
  RECOVERING:
    recommendations:
      - gradual_recovery
